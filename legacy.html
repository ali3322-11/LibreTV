<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CinePop 老版 - 搜索播放</title>
<!--
  DRAFT - 未部署，未推送。草稿位置: ~/workspace/legacy-draft/legacy.html
  目的: 给 iPhone 4 (iOS 6.1.3) / iPad iOS 11.3 这类老设备用的极简页,
  只做搜索 + 选集 + 播放,无首页推荐、无海报、无主题切换。
  写法限制(对应老 WebKit): 只用 var / function / XMLHttpRequest,
  不用 fetch、Promise、async、箭头函数、模板字符串、?.、const/let。
  密码: 沿用主站机制。服务端 _middleware.js 会把下面 window.__ENV__.PASSWORD
  这一行里的 {{PASSWORD}} 替换成密码哈希,这一行必须原样保留,删了就验不过。
  搜索/详情: 走主站同款 /proxy/ 转发采集源,带 auth 哈希 + 时间戳。
  资源选择: 下拉框从站内 js/config.js 文本里解析资源名和地址(不执行该文件),
  解析失败时只留默认源;选中的资源记在 localStorage 里,下次打开还用它。
  播放: 优先取带 .m3u8/.mp4 的直链,交给 <video> 原生播放;播不了自动试
  同一集的其他线路($$$ 后面的源),都失败才提示换资源/换片。
  未验证的风险(真机测试前不要承诺能用):
  1) iOS 6.1.3 的 TLS 太老,可能连 Cloudflare 的 HTTPS 握手都过不了,
     页面根本下载不下来,这是 JS 改不了的。
  2) 有些源返回的不是可直接播的 m3u8/mp4,老机播不了,只能逐个试。
  部署方法(需 quan 定夺后由他/主 agent 执行,本草稿不自动部署):
  把本文件复制为 libretv-work/legacy.html,连同 libs/sha256.min.js 已在仓内,
  提交并推送到 ali3322-11/LibreTV 的 main,Cloudflare Pages 部署后访问
  https://newpaopao.dpdns.org/legacy.html
-->
<style>
body{font-family:Arial,sans-serif;background:#000;color:#fff;margin:0;padding:10px;font-size:18px}
h1{font-size:20px;margin:6px 0}
input,button{font-size:18px;padding:8px}
input{width:58%}
select{font-size:18px;padding:8px;max-width:100%}
button{background:#e50914;color:#fff;border:0;padding:8px 14px}
a{color:#fff}
.item{border-bottom:1px solid #333;padding:10px 0}
.ep{margin:4px 6px 4px 0;background:#3b82f6;color:#fff}
video{width:100%;background:#000}
.note{color:#aaa;font-size:14px}
.err{color:#ff6666}
</style>
</head>
<body>
<h1>CinePop 老版</h1>
<div id="pwdBox">
<p>请输入密码:</p>
<form id="pwdForm" action="#">
<input type="password" id="pwdInput" autocomplete="off">
<button type="submit">确定</button>
</form>
<p class="note" id="pwdMsg"></p>
</div>
<div id="mainBox" style="display:none">
<p>资源: <select id="srcSel"><option value="">加载中...</option></select></p>
<form id="searchForm" action="#">
<input type="text" id="q" placeholder="输入片名">
<button type="submit">搜索</button>
</form>
<p class="note">先选资源,再搜索。搜到点片名,再点集数播放。</p>
<div id="msg"></div>
<div id="results"></div>
<h2 id="playTitle" style="display:none"></h2>
<div id="episodes"></div>
<video id="player" controls style="display:none"></video>
<p class="note" id="directWrap" style="display:none">放不了时点: <a id="directLink" href="#" target="_blank">直接打开播放地址</a></p>
</div>
<script src="libs/sha256.min.js"></script>
<script>
window.__ENV__ = window.__ENV__ || {};
window.__ENV__.PASSWORD = "{{PASSWORD}}";
</script>
<script>
var SOURCES = [{key: 'heimuer', name: '黑木耳', api: 'https://json.heimuer.xyz/api.php/provide/vod'}];
var API_URL = SOURCES[0].api;
var srcSel = document.getElementById('srcSel');
function rebuildSourceList() {
  var i, html = '';
  for (i = 0; i < SOURCES.length; i++) {
    html += '<option value="' + esc(SOURCES[i].api) + '"' + (SOURCES[i].api === API_URL ? ' selected' : '') + '>' + esc(SOURCES[i].name) + '</option>';
  }
  srcSel.innerHTML = html;
}
function saveSource(api) {
  try { localStorage.setItem('legacySource', api); } catch (e) {}
}
function loadSavedSource() {
  try { return localStorage.getItem('legacySource') || ''; } catch (e) { return ''; }
}
srcSel.onchange = function () {
  if (srcSel.value) {
    API_URL = srcSel.value;
    saveSource(API_URL);
    resultsBox.innerHTML = '';
    episodesBox.innerHTML = '';
    msgBox.innerHTML = '';
    TRYING = false;
  }
};
function parseConfigSites(text) {
  var list = [];
  var lines = text.split('\n');
  var i, line, trimmed, m, key = '', api = '', name = '';
  var inSites = false;
  for (i = 0; i < lines.length; i++) {
    line = lines[i];
    trimmed = line.replace(/^\s+|\s+$/g, '');
    if (!inSites) {
      if (line.indexOf('API_SITES') !== -1) { inSites = true; }
      continue;
    }
    if (trimmed === '};') { break; }
    m = line.match(/^\s{4}(\w+):\s*\{$/);
    if (m) { key = m[1]; api = ''; name = ''; continue; }
    if (key) {
      m = line.match(/api:\s*'([^']+)'/);
      if (m) { api = m[1]; }
      m = line.match(/name:\s*'([^']+)'/);
      if (m) { name = m[1]; }
      if (trimmed === '},' || trimmed === '}') {
        if (key !== 'testSource' && api && name) { list.push({key: key, name: name, api: api}); }
        key = '';
      }
    }
  }
  return list;
}
function loadSources() {
  var xhr;
  if (!window.XMLHttpRequest) { return; }
  xhr = new XMLHttpRequest();
  xhr.onreadystatechange = function () {
    if (xhr.readyState === 4 && xhr.status === 200) {
      var parsed = parseConfigSites(xhr.responseText);
      var i, saved = loadSavedSource(), found = false;
      if (parsed.length > 1) {
        SOURCES = parsed;
        for (i = 0; i < SOURCES.length; i++) { if (SOURCES[i].api === saved) { found = true; } }
        if (found) { API_URL = saved; }
        else if (!saved) {
          for (i = 0; i < SOURCES.length; i++) { if (SOURCES[i].key === 'heimuer') { API_URL = SOURCES[i].api; } }
        }
        rebuildSourceList();
      }
    }
  };
  xhr.open('GET', 'js/config.js', true);
  xhr.send(null);
}
var pwdBox = document.getElementById('pwdBox');
var mainBox = document.getElementById('mainBox');
var pwdMsg = document.getElementById('pwdMsg');
var msgBox = document.getElementById('msg');
var resultsBox = document.getElementById('results');
var episodesBox = document.getElementById('episodes');
var player = document.getElementById('player');
var playTitle = document.getElementById('playTitle');
var directWrap = document.getElementById('directWrap');
var directLink = document.getElementById('directLink');
var ALL_SOURCES_EPS = [];
var CUR_EP = 0;
var CUR_TRY = 0;
var TRYING = false;
function isDirectMedia(u) {
  return u.indexOf('.m3u8') !== -1 || u.indexOf('.mp4') !== -1 || u.indexOf('.mov') !== -1;
}
function isBadPage(u) {
  return u.indexOf('/share/') !== -1 || u.indexOf('player.html') !== -1 || u.indexOf('.html') !== -1;
}
function parseSourceEpisodes(src) {
  var eps = [];
  if (!src) { return eps; }
  var parts = src.split('#');
  var i, p, u;
  for (i = 0; i < parts.length; i++) {
    p = parts[i].split('$');
    u = p.length > 1 ? p[1] : '';
    if (u && (u.indexOf('http://') === 0 || u.indexOf('https://') === 0)) {
      eps.push({name: p[0] || ('第' + (i + 1) + '集'), url: u});
    }
  }
  return eps;
}
function parseAllSources(playUrl) {
  var out = [], i, eps;
  if (!playUrl) { return out; }
  var sources = playUrl.split('$$$');
  for (i = 0; i < sources.length; i++) {
    eps = parseSourceEpisodes(sources[i]);
    if (eps.length) { out.push(eps); }
  }
  return out;
}
function choosePrimary(all) {
  var best = 0, bestScore = -999, i, j, score;
  for (i = 0; i < all.length; i++) {
    score = 0;
    for (j = 0; j < all[i].length; j++) {
      if (isDirectMedia(all[i][j].url)) { score += 2; }
      if (isBadPage(all[i][j].url)) { score -= 3; }
    }
    if (score > bestScore) { bestScore = score; best = i; }
  }
  return best;
}
function tryNextSource() {
  var url = '', s;
  for (s = CUR_TRY; s < ALL_SOURCES_EPS.length; s++) {
    if (ALL_SOURCES_EPS[s][CUR_EP] && ALL_SOURCES_EPS[s][CUR_EP].url) {
      url = ALL_SOURCES_EPS[s][CUR_EP].url;
      CUR_TRY = s;
      break;
    }
  }
  if (!url) {
    TRYING = false;
    msgBox.innerHTML = '<span class="err">都试过了,这个片在 iPhone 4 上格式不支持,换个资源或换个片试试</span>';
    return;
  }
  if (CUR_TRY > 0) { msgBox.innerHTML = '这个格式放不了,正在试第 ' + (CUR_TRY + 1) + ' 个线路...'; }
  player.style.display = 'block';
  directWrap.style.display = 'block';
  directLink.href = url;
  player.src = url;
  player.load();
  try { player.play(); } catch (e) {}
}
function playEpisode(idx) {
  CUR_EP = idx;
  CUR_TRY = 0;
  TRYING = true;
  tryNextSource();
}
if (player.addEventListener) {
  player.addEventListener('error', function () {
    if (!TRYING) { return; }
    CUR_TRY++;
    tryNextSource();
  });
}

function isProtected() {
  var h = window.__ENV__ && window.__ENV__.PASSWORD;
  return typeof h === 'string' && h.length === 64 && !/^0+$/.test(h);
}
function storedVerified() {
  try {
    var raw = localStorage.getItem('passwordVerified');
    if (!raw) { return false; }
    var o = JSON.parse(raw);
    var h = window.__ENV__ && window.__ENV__.PASSWORD;
    return o && o.verified && o.passwordHash === h &&
      (new Date().getTime() - o.timestamp) < 90 * 24 * 60 * 60 * 1000;
  } catch (e) { return false; }
}
function showMain() {
  pwdBox.style.display = 'none';
  mainBox.style.display = 'block';
}
if (!isProtected() || storedVerified()) { showMain(); }

document.getElementById('pwdForm').onsubmit = function () {
  var input = document.getElementById('pwdInput').value;
  var hash = '';
  try { hash = sha256(input); } catch (e) { hash = ''; }
  var correct = window.__ENV__ && window.__ENV__.PASSWORD;
  if (hash && hash === correct) {
    try {
      localStorage.setItem('passwordVerified', JSON.stringify({
        verified: true, timestamp: new Date().getTime(), passwordHash: correct
      }));
    } catch (e) {}
    showMain();
  } else {
    pwdMsg.innerHTML = '密码错误,请重试';
  }
  return false;
};

function proxyUrl(apiUrl) {
  var url = '/proxy/' + encodeURIComponent(apiUrl);
  var h = window.__ENV__ && window.__ENV__.PASSWORD;
  if (isProtected() && h) {
    url = url + '?auth=' + encodeURIComponent(h) + '&t=' + new Date().getTime();
  }
  return url;
}
function getJSON(url, ok, fail) {
  var xhr;
  if (window.XMLHttpRequest) { xhr = new XMLHttpRequest(); }
  else { xhr = new ActiveXObject('Microsoft.XMLHTTP'); }
  xhr.onreadystatechange = function () {
    if (xhr.readyState === 4) {
      if (xhr.status === 200) {
        var data = null;
        try { data = JSON.parse(xhr.responseText); } catch (e) { data = null; }
        if (data) { ok(data); } else { fail('返回内容不是 JSON'); }
      } else {
        fail('请求失败,状态码 ' + xhr.status);
      }
    }
  };
  xhr.open('GET', url, true);
  xhr.send(null);
}
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
rebuildSourceList();
loadSources();

document.getElementById('searchForm').onsubmit = function () {
  var q = document.getElementById('q').value;
  if (!q) { return false; }
  msgBox.innerHTML = '搜索中...';
  resultsBox.innerHTML = '';
  episodesBox.innerHTML = '';
  player.style.display = 'none';
  directWrap.style.display = 'none';
  playTitle.style.display = 'none';
  var url = API_URL + '?ac=videolist&wd=' + encodeURIComponent(q);
  getJSON(proxyUrl(url), function (data) {
    var list = data.list || [];
    if (!list.length) { msgBox.innerHTML = '没有搜到结果,换个片名试试'; return; }
    msgBox.innerHTML = '搜到 ' + list.length + ' 条,点片名看集数';
    var html = '';
    var i, item;
    for (i = 0; i < list.length; i++) {
      item = list[i];
      html += '<div class="item"><a href="#" data-id="' + esc(item.vod_id) + '" data-name="' + esc(item.vod_name) + '">' +
        esc(item.vod_name) + ' (' + esc(item.vod_year) + ') ' + esc(item.type_name) + '</a></div>';
    }
    resultsBox.innerHTML = html;
    var links = resultsBox.getElementsByTagName('a');
    for (i = 0; i < links.length; i++) {
      links[i].onclick = function () {
        loadDetail(this.getAttribute('data-id'), this.getAttribute('data-name'));
        return false;
      };
    }
  }, function (err) { msgBox.innerHTML = '<span class="err">' + esc(err) + '</span>'; });
  return false;
};

function loadDetail(id, name) {
  msgBox.innerHTML = '正在取播放地址...';
  episodesBox.innerHTML = '';
  var url = API_URL + '?ac=videolist&ids=' + encodeURIComponent(id);
  getJSON(proxyUrl(url), function (data) {
    var list = data.list || [];
    if (!list.length) { msgBox.innerHTML = '取不到详情'; return; }
    var detail = list[0];
    ALL_SOURCES_EPS = parseAllSources(detail.vod_play_url);
    if (!ALL_SOURCES_EPS.length) { msgBox.innerHTML = '这个片没有可播的地址,换一个源/片名试试'; return; }
    var primary = choosePrimary(ALL_SOURCES_EPS);
    var eps = ALL_SOURCES_EPS[primary];
    ALL_SOURCES_EPS.unshift(ALL_SOURCES_EPS.splice(primary, 1)[0]);
    if (!eps.length) { msgBox.innerHTML = '这个片没有可播的地址,换一个源/片名试试'; return; }
    msgBox.innerHTML = '';
    playTitle.style.display = 'block';
    playTitle.innerHTML = esc(name || detail.vod_name);
    var html = '';
    var i;
    for (i = 0; i < eps.length; i++) {
      html += '<button class="ep" data-idx="' + i + '">' + esc(eps[i].name) + '</button>';
    }
    episodesBox.innerHTML = html;
    var btns = episodesBox.getElementsByTagName('button');
    for (i = 0; i < btns.length; i++) {
      btns[i].onclick = function () {
        playEpisode(parseInt(this.getAttribute('data-idx'), 10));
      };
    }
  }, function (err) { msgBox.innerHTML = '<span class="err">' + esc(err) + '</span>'; });
}
function parseEpisodes(playUrl) {
  var all = parseAllSources(playUrl);
  if (!all.length) { return []; }
  return all[choosePrimary(all)];
}
</script>
</body>
</html>
